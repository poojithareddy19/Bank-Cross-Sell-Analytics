name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Tests use synthetic fixtures only; Kaggle is never contacted in CI.
      - name: Run tests
        run: python -m pytest
