# Product catalogue: raw Santander flag column, English name and family.
#
# ladder: ordered steps of the product ladder funnel. A customer reaches a step by
# holding any one of its products in or after the month they reached the previous
# step. The ladder is proposed from the transition matrix (reports/ladder_proposal.md)
# and frozen here only after review; while it is empty the funnel is skipped.
# Example shape:
#   ladder:
#     - {name: Current account, products: [ind_cco_fin_ult1]}
#     - {name: Direct debit or e-account, products: [ind_recibo_ult1, ind_ecue_fin_ult1]}

products:
  - {code: ind_ahor_fin_ult1, name: Saving account, family: savings}
  - {code: ind_aval_fin_ult1, name: Guarantees, family: other}
  - {code: ind_cco_fin_ult1, name: Current account, family: core}
  - {code: ind_cder_fin_ult1, name: Derivatives account, family: investment}
  - {code: ind_cno_fin_ult1, name: Payroll account, family: core}
  - {code: ind_ctju_fin_ult1, name: Junior account, family: core}
  - {code: ind_ctma_fin_ult1, name: Mas particular account, family: core}
  - {code: ind_ctop_fin_ult1, name: Particular account, family: core}
  - {code: ind_ctpp_fin_ult1, name: Particular plus account, family: core}
  - {code: ind_deco_fin_ult1, name: Short-term deposit, family: savings}
  - {code: ind_deme_fin_ult1, name: Medium-term deposit, family: savings}
  - {code: ind_dela_fin_ult1, name: Long-term deposit, family: savings}
  - {code: ind_ecue_fin_ult1, name: E-account, family: digital}
  - {code: ind_fond_fin_ult1, name: Funds, family: investment}
  - {code: ind_hip_fin_ult1, name: Mortgage, family: lending}
  - {code: ind_plan_fin_ult1, name: Pension plan, family: investment}
  - {code: ind_pres_fin_ult1, name: Loan, family: lending}
  - {code: ind_reca_fin_ult1, name: Taxes, family: services}
  - {code: ind_tjcr_fin_ult1, name: Credit card, family: card}
  - {code: ind_valo_fin_ult1, name: Securities, family: investment}
  - {code: ind_viv_fin_ult1, name: Home account, family: savings}
  - {code: ind_nomina_ult1, name: Payroll, family: services}
  - {code: ind_nom_pens_ult1, name: Pension payments, family: services}
  - {code: ind_recibo_ult1, name: Direct debit, family: services}

# Confirmed 2026-10-05 from the first-time transitions on the real data
# (reports/ladder_proposal.md): payroll account, payroll and pension payments are adopted
# within about a month of each other, so they form one step.
ladder:
  - {name: Current account, products: [ind_cco_fin_ult1]}
  - {name: Direct debit, products: [ind_recibo_ult1]}
  - {name: Payroll package, products: [ind_cno_fin_ult1, ind_nomina_ult1, ind_nom_pens_ult1]}
  - {name: Credit card, products: [ind_tjcr_fin_ult1]}
